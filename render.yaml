services:
  # StudentVoiceX Django Backend API
  - type: web
    name: studentvoicex-backend
    runtime: python
    buildCommand: bash backend/build.sh
    startCommand: gunicorn --chdir backend votechain_server.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: studentvoicex-db
          property: connectionString

databases:
  # Free PostgreSQL Database
  - name: studentvoicex-db
    databaseName: studentvoicex
    user: studentvoicex_user
    plan: free
